apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance-api
  template:
    metadata:
      labels:
        app: finance-api
    spec:
      containers:
        - name: finance-api
          image: finance-api:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: finance-api
spec:
  selector:
    app: finance-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP